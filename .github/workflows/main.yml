name: OrangeOS Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm build-essential bison flex libgmp3-dev libmpc-dev libmpfr-dev texinfo
    
    - name: Install i686-elf cross-compiler
      run: |
        sudo apt-get install -y gcc-multilib g++-multilib
        # Download pre-built cross-compiler or build from source
        wget https://github.com/lordmilko/i686-elf-tools/releases/download/7.1.0/i686-elf-tools-linux.zip
        unzip i686-elf-tools-linux.zip
        echo "$PWD/i686-elf-tools-linux/bin" >> $GITHUB_PATH
    
    - name: Build OrangeOS
      run: make
    
    - name: Upload OS image
      uses: actions/upload-artifact@v4
      with:
        name: orangeos-image
        path: orangeos.img
